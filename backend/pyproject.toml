[project]
name = "toolii-backend"
version = "0.1.0"
description = "Toolii backend API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.13.0",
  "apscheduler>=3.10.0",
  "bcrypt>=4.0.0",
  "email-validator>=2.0.0",
  "fastapi>=0.110.0",
  "google-auth>=2.0.0",
  "httpx>=0.27.0",
  "orjson>=3.10.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "aiosqlite>=0.20.0",
  "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]
processing = [
  "opencv-python-headless>=4.10.0",
  "pikepdf>=9.0.0",
  "pillow>=10.0.0",
  "pillow-heif>=0.18.0",
  "PyPDF2>=3.0.0",
  "rembg[cpu]>=2.0.0",
  "reportlab>=4.0.0",
  "mediapipe>=0.10.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
