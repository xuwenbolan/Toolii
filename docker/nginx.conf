server {
    listen 8001;
    server_name _;

    # Hide Nginx version
    server_tokens off;

    # Emit relative redirects so the internal port/scheme is not exposed
    absolute_redirect off;

    # Global limits
    # Must match backend RequestSizeLimitMiddleware (security_headers.py)
    client_max_body_size 550m;
    client_body_buffer_size 2m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Security headers — defined in a shared snippet so nested locations
    # that use add_header don't silently drop them (nginx inheritance quirk).
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Internal location for X-Accel-Redirect file serving.
    # Enables HTTP Range requests, sendfile, and frees Python workers.
    location /internal-data/ {
        internal;
        alias /data/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Processing endpoints may take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Share pages — backend serves HTML with OG tags for social previews
    location /s/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File hub share pages — OG tags then redirect to SPA
    location /t/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Replace nonce placeholder in HTML with a per-request unique value.
        # Combined with 'strict-dynamic' in CSP, this allows trusted scripts
        # to propagate trust to scripts they load (e.g. gtag.js inline scripts).
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' '$request_id';

        # Cache static assets — must re-include security headers because
        # nginx add_header in a nested block overrides all parent headers.
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            include /etc/nginx/security-headers.conf;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
