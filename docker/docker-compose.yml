services:
  backend:
    container_name: toolii-backend
    image: toolii-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      ENV: prod
      DATABASE_URL: sqlite+aiosqlite:///../data/toolii.db
      FILE_STORAGE_DIR: ../data/files
      USE_X_ACCEL_REDIRECT: "true"
      # CORS_ORIGINS: loaded from .env
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    networks:
      - toolii-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    container_name: toolii-web
    image: toolii-web
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_GA_MEASUREMENT_ID: G-HPXR8NRW33
        VITE_GOOGLE_CLIENT_ID: 877608236921-quer9hbn6ged8bmpui8mht1pbjrd2vgj.apps.googleusercontent.com
        VITE_SITE_URL: https://www.toolii.cc
    volumes:
      - ../data:/data:ro
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - toolii-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cortex:
    container_name: toolii-cortex
    image: toolii-cortex
    profiles:
      - gpu
    build:
      context: ..
      dockerfile: docker/Dockerfile.cortex
    volumes:
      - ../data/cortex:/app/data
    env_file:
      - ../.env
    environment:
      - CORTEX_DATA_DIR=/app/data
      - CORTEX_LOG_LEVEL=INFO
    ports:
      - "${CORTEX_BIND_HOST:-127.0.0.1}:9100:9100"
    networks:
      - toolii-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  toolii-net:
    name: toolii-net
