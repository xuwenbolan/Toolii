version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    env_file:
      - ../.env
    environment:
      ENV: prod
      DATABASE_URL: sqlite+aiosqlite:///../data/toolii.db
      FILE_STORAGE_DIR: ../data/files
      CORS_ORIGINS: http://localhost
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        VITE_GA_MEASUREMENT_ID: G-HPXR8NRW33
        VITE_GOOGLE_CLIENT_ID: 877608236921-quer9hbn6ged8bmpui8mht1pbjrd2vgj.apps.googleusercontent.com
        VITE_SITE_URL: https://www.toolii.cc
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - backend
    restart: unless-stopped
